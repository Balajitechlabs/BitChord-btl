# mise — project-local tool versions for BitChord-btl
# https://mise.jdx.dev/configuration.html
#
# Managed runtimes only. Android SDK / NDK / CMake are managed
# by the `android` CLI (android sdk install ...) — not mise.
# Gradle is intentionally absent: the Gradle Wrapper (./gradlew)
# already pins the exact version via gradle-wrapper.properties.

[tools]
java   = "zulu-21"  # JDK required by AGP 8.10.1+ and Gradle 8.11.1
python = "3.15.2"   # Build scripts, automation tooling
bun    = "latest"   # web/ module JS tooling

[env]
# Android SDK paths — the android CLI installs everything here
ANDROID_HOME     = "~/Library/Android/sdk"
ANDROID_SDK_ROOT = "~/Library/Android/sdk"

# NDK — installed via: android sdk install "ndk;27.0.12077973"
ANDROID_NDK_HOME = "~/Library/Android/sdk/ndk/27.0.12077973"

# JAVA_HOME is automatically set by mise's java tool —
# no need to hardcode a path here.
